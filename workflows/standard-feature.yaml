# Canonical SpecFlow workflow template.
#
# A block's name carries no behavior. Each node is an `agent` node, run through
# a harness, or a `command` node, run by the orchestrator as a deterministic
# gate. Everything that makes a node "explore" or "verify" is configuration
# below - the engine only knows the two kinds.
#
# `model: default` means "let the harness choose". It is never forwarded as a
# model identifier.
id: standard-feature
name: Standard feature
description: >-
  Explore the problem, propose an OpenSpec change, implement it, review the
  diff, run the tests, validate, archive, and merge.
version: 2

defaults:
  harness: pi
  model: default
  interactive: false
  allow_inject: true

nodes:
  - id: explore
    title: Explore
    kind: agent
    skill: openspec-explore
    prompt: |
      The run objective is: {{objective}}
      Explore the repository and that objective. Ask the operator when a
      decision is needed.
    harness: pi
    model:
      id: default
      thinking: high
    interactive: true
    allow_inject: true
    # Explore's outcome is the conversation it had, not a file: there is no
    # honest repository postcondition to declare.

  - id: propose
    title: Propose
    kind: agent
    skill: openspec-propose
    prompt: |
      The run objective is: {{objective}}
      Create a change that satisfies it.
    harness: pi
    allow_inject: true
    require_approval: true
    postcondition:
      type: new_change
      description: Propose must create a new change under openspec/changes/

  - id: apply
    title: Apply
    kind: agent
    skill: openspec-apply-change
    prompt: |
      The run objective is: {{objective}}
      Implement the change "{{change}}".
    harness: pi
    interactive: true
    allow_inject: true
    postcondition:
      type: tasks_complete
      change: "{{change}}"
      description: Every task in the change must be checked

  - id: review
    title: Review
    kind: agent
    prompt: Review the current changes. Report defects; do not rewrite them.
    harness: pi
    allow_inject: true

  - id: tests
    title: Tests
    kind: agent
    prompt: Add or update the tests this change needs, then run them and report failures.
    harness: pi
    allow_inject: true

  - id: verify
    title: Verify
    kind: command
    command: openspec validate "{{change}}" --strict && make test
    timeout: 10m
    postcondition:
      type: exit_zero
      description: Validation and the test suite must pass

  - id: archive
    title: Archive
    kind: command
    # Archiving is deterministic: a completed run must not silently skip it
    # because a model chose not to call the skill.
    command: openspec archive "{{change}}" --yes
    postcondition:
      type: exit_zero
      description: The change must archive cleanly

  # The merge runs in the project checkout, never in the run worktree: the
  # worktree already has the run branch checked out, so it cannot also check
  # out the branch being merged into.
  - id: merge
    title: Merge
    kind: command
    workdir: project
    command: git merge --no-ff specflow/run-{{run_id}} -m "Merge {{change}}"
    require_approval: true
    postcondition:
      type: exit_zero
      description: The run branch must merge cleanly

edges:
  - {from: explore, to: propose}
  - {from: propose, to: apply}
  - {from: apply, to: review}
  - {from: review, to: tests}
  - {from: tests, to: verify}
  - {from: verify, to: archive}
  - {from: archive, to: merge}
